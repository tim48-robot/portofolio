<title>Awaken</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root{ --aura:#a855f7; --hot:#f3e8ff; --p:0; --charge:0; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#030207;color:#ece9f5;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}

  .hero{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;isolation:isolate}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
  #gl.shake{animation:shake .45s cubic-bezier(.3,.7,.4,1)}
  @keyframes shake{0%,100%{transform:translate(0,0)}10%{transform:translate(-14px,8px)}25%{transform:translate(12px,-10px)}40%{transform:translate(-8px,6px)}60%{transform:translate(5px,-4px)}80%{transform:translate(-2px,2px)}}

  /* the stage defines where your portrait is drawn (the WebGL shader reads its position) */
  .stage{position:absolute;z-index:2;right:1vw;bottom:0;height:min(98vh,1100px);aspect-ratio:6/7;pointer-events:none}
  .hit{position:absolute;left:18%;right:18%;top:26%;bottom:0;pointer-events:auto;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;border:0;padding:0;background:none;color:inherit;font:inherit}
  .hit:focus-visible{outline:1px dashed color-mix(in srgb,var(--hot) 55%,transparent);outline-offset:-10px}
  .hint{position:absolute;left:50%;bottom:max(1.1rem,env(safe-area-inset-bottom));translate:-50% 0;z-index:5;font:600 .75rem 'JetBrains Mono',monospace;letter-spacing:.24em;color:#b9b3cc;
        white-space:nowrap;opacity:calc(1 - var(--p) * 1.2);pointer-events:none;text-align:center;text-shadow:0 1px 8px #030207}
  .hint .coarse{display:none}
  @media (pointer:coarse){.hint .fine{display:none}.hint .coarse{display:inline}}

  .intro{position:relative;z-index:3;max-width:560px;padding:0 0 0 6vw;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;pointer-events:none}
  .intro > *{pointer-events:auto}
  .tag{font:600 .78rem 'JetBrains Mono',monospace;letter-spacing:.3em;color:var(--aura);text-transform:uppercase}
  h1{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:clamp(3.8rem,9vw,9rem);line-height:.86;margin:.7rem 0 1rem;color:#f7f5ff;
     text-shadow:0 0 calc(var(--p) * 36px) var(--aura),0 0 calc(var(--p) * 6px) var(--hot)}
  .tagline{max-width:36ch;color:#b8b3c8;line-height:1.65}

  .btns{display:flex;gap:1rem;margin-top:1.6rem;flex-wrap:wrap}
  .btn{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.18em;font-size:1.15rem;padding:.8rem 1.7rem;text-decoration:none;color:#f5f3ff;
       border:1px solid color-mix(in srgb,var(--aura) 60%,transparent);background:rgba(8,6,16,.4);transition:.25s}
  .btn.primary{background:var(--aura);color:#0a0612;border-color:var(--aura)}
  .btn:hover{box-shadow:0 0 25px var(--aura);transform:translateY(-2px)}


  .burst{position:absolute;z-index:1;width:250vmax;height:250vmax;translate:-50% -50%;pointer-events:none;
         background:repeating-conic-gradient(from 0deg,#07040d 0 .5deg,transparent .5deg 3.6deg);
         -webkit-mask:radial-gradient(circle,transparent 9%,#000 15%,#000 30%,transparent 46%);mask:radial-gradient(circle,transparent 9%,#000 15%,#000 30%,transparent 46%);
         animation:burst .62s cubic-bezier(.15,.85,.3,1) forwards}
  @keyframes burst{0%{opacity:1;transform:scale(.45) rotate(0deg)}70%{opacity:.9}100%{opacity:0;transform:scale(var(--s)) rotate(4deg)}}

  /* status: the original violet-sheet type (Barlow Condensed caps, a ruled title, amber only for values that move),
     set inside the ornate violet frame */
  .sheet{visibility:hidden;position:relative;margin-top:1.6rem;width:min(470px,100%);color:#fff;font-family:'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;
         background:url(status-frame.webp) center/100% 100% no-repeat;padding:2.2rem 2.7rem 2.3rem;filter:drop-shadow(0 16px 30px rgba(8,4,20,.6))}
  .sheet-t{font-weight:600;font-size:1.85rem;letter-spacing:.06em;text-align:center;line-height:1}
  .sheet-rule{height:2px;margin:.85rem -.5rem 1.1rem;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.8);transform-origin:center}
  .sheet-rows{display:grid;gap:.55rem;margin:0}
  .sheet-rows > div{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;font-size:1.05rem;letter-spacing:.04em}
  .sheet-rows dt{font-weight:400}
  .sheet-rows dd{margin:0;font-weight:600;text-align:right}
  .sheet .amber{color:#ffd166;font-variant-numeric:tabular-nums}
  .meter{display:block;width:clamp(100px,30vw,150px);height:6px;background:rgba(25,12,55,.45);align-self:center}
  .meter::after{content:"";display:block;height:100%;width:calc(max(var(--p) * 70%, var(--charge) * 100%));background:#ffd166}
  .sheet .pix{position:absolute;inset:0;display:grid;pointer-events:none}
  .sheet .pix i{opacity:0;background:#8a6fd0}
  .back{position:fixed;top:1rem;left:1rem;z-index:10;font:600 .72rem 'JetBrains Mono',monospace;letter-spacing:.12em;color:#cfcbe0;text-decoration:none;
        padding:.5rem .8rem;border:1px solid rgba(255,255,255,.14);background:rgba(10,8,18,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .back:hover{color:#fff;border-color:var(--aura)}
  @media (prefers-reduced-motion: reduce){.burst{animation:none !important}#gl.shake{animation:none}}
  .controls{position:fixed;left:50%;bottom:max(1rem,env(safe-area-inset-bottom));translate:-50% 0;z-index:10;display:flex;flex-wrap:wrap;justify-content:center;gap:.25rem;align-items:center;width:max-content;max-width:calc(100vw - 2rem);
            padding:.4rem;border-radius:18px;background:rgba(10,8,18,.75);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:96vw}
  .chip{border:0;cursor:pointer;font:600 .72rem Inter,sans-serif;letter-spacing:.04em;color:#cfcbe0;background:transparent;padding:.45rem .7rem;border-radius:999px;display:flex;gap:.4rem;align-items:center}
  .chip i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
  .chip.on{background:rgba(255,255,255,.12);color:#fff}
  .sep{width:1px;height:18px;background:rgba(255,255,255,.14);margin:0 .2rem}
  label.chip input{display:none}
  .controls,.hud{display:none!important}
  html.dev .controls{display:flex!important}
  html.dev .hud{display:block!important}
  .pills{position:fixed;top:1rem;right:1rem;z-index:10;display:flex;gap:.4rem}
  .pills .chip{border:1px solid rgba(255,255,255,.14);background:rgba(10,8,18,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .hud{position:fixed;top:3.4rem;right:1rem;z-index:10;font:400 .66rem 'JetBrains Mono',monospace;color:#6f6a83;letter-spacing:.08em;text-align:right}
  .nogl{position:absolute;inset:0;display:none;place-items:end center;text-align:center;padding:2rem 2rem 4rem;color:#aaa;font-size:.8rem}
  .hero.nogl-on{background:#030207 url(bg-b.webp) center/cover no-repeat}

  /* Phones, tablets and any portrait screen: the portrait is sized by the screen height and pinned near the top,
     so your face keeps the same place on every device; the text floats over a dark scrim below it. */
  @media (max-width:880px), (orientation:portrait) and (max-width:1180px){
    .stage{right:auto;left:50%;translate:-50% 0;bottom:auto;top:calc(3.2rem + 1svh);height:min(80svh,150vw)}
    .intro{min-height:auto;max-width:none;padding:calc(3.2rem + 1svh + min(80svh,150vw) * .58) 6vw 7.5rem}
    .intro::before{content:"";position:absolute;left:0;right:0;bottom:0;top:calc(3.2rem + min(80svh,150vw) * .4);z-index:-1;pointer-events:none;
      background:linear-gradient(180deg,rgba(3,2,7,0) 0%,rgba(3,2,7,.82) 22%,#030207 42%)}
    .intro > .tag{margin-top:0}
    h1{font-size:clamp(2.9rem,13vw,4.8rem)}
    .hint{bottom:auto;top:calc(3.2rem + 1svh + min(80svh,150vw) * .5);letter-spacing:.18em}
    .hud{display:none}
    .controls{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;border-radius:999px;scrollbar-width:none;width:94vw}
    .controls::-webkit-scrollbar{display:none}
    .chip{flex:0 0 auto;padding:.4rem .6rem;font-size:.7rem}
  }
</style>

<section class="hero" id="hero">
  <canvas id="gl"></canvas>
  <div class="nogl" id="nogl">Your browser doesn't support WebGL2, so the aura can't render here.</div>

  <div class="stage" id="stage">
    <button class="hit" id="hit" type="button" aria-label="Hold to charge the aura, release to burst"></button>
  </div>

  <div class="intro">
    <h1>JUSTIN<br/>TIMOTHY</h1>
    <p class="tagline">Developer. I build things that hit.</p>
    <div class="sheet" id="sheet" role="group" aria-label="Status">
      <div class="sheet-t">Status</div>
      <div class="sheet-rule"></div>
      <dl class="sheet-rows">
        <div><dt>Name</dt><dd>Justin Timothy</dd></div>
        <div><dt>Class</dt><dd>Developer</dd></div>
        <div><dt>Aura</dt><dd class="amber" id="auraPct">0%</dd></div>

</section>

<div class="hud" id="hud"></div>
<div class="pills">
  <button class="chip on" id="ink" type="button" aria-pressed="true">Ink on</button>

</div>

<div class="controls">
  <button class="chip on" data-theme="shadow" style="--c:#a855f7"><i></i>Shadow</button>
  <button class="chip" data-theme="gold" style="--c:#fbbf24"><i></i>Golden</button>
  <button class="chip" data-theme="crimson" style="--c:#ef4444"><i></i>Crimson</button>

  <button class="chip" id="q">Quality: Auto</button>
  <span class="sep"></span>
  <label class="chip">📷 Photo<input type="file" accept="image/*" id="filePhoto"></label>
  <label class="chip">🖼 4K BG<input type="file" accept="image/*" id="fileBg"></label>
</div>

<script>
(() => {
/* =========================================================================
   AURA AWAKENING — WebGL2 manhwa aura engine
   Add ?dev to the URL for the theme, quality, upload buttons and the fps readout.
   ========================================================================= */
const PHOTO_URL = "me.webp";
const BG_URL = "bg-b.webp";
const DEPTH_URL = "bg-b-depth.webp";   // greyscale depth of BG (white = near), pre-baked offline with Depth Anything V2
const DEV = /[?&]dev\b/.test(location.search);
if (DEV) document.documentElement.classList.add('dev');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const THEMES = {
  shadow : {css:'#a855f7', hot:'#f3e8ff', deep:[.07,.02,.14], aura:[.55,.2,1.0],  glow:[.92,.84,1.0], alt:[.22,.18,.95]},
  gold   : {css:'#f59e0b', hot:'#fff7d6', deep:[.12,.06,.01], aura:[1.0,.6,.1],   glow:[1.0,.96,.8],  alt:[1.0,.3,.04]},
  crimson: {css:'#ef4444', hot:'#ffe4e4', deep:[.13,.01,.03], aura:[1.0,.1,.14],  glow:[1.0,.86,.8],  alt:[.65,.0,.3]},
  frost  : {css:'#38bdf8', hot:'#e0f7ff', deep:[.01,.05,.13], aura:[.18,.62,1.0], glow:[.86,.97,1.0], alt:[.12,.26,.95]},
};
let theme = THEMES.shadow;

const $ = s => document.querySelector(s);
const hero = $('#hero'), cv = $('#gl'), stage = $('#stage'), hit = $('#hit'), root = document.documentElement;
SFX.uses(['sfx/explosion-yours.mp3', 'sfx/card-whoosh-b.mp3']);
{ const b = $('#snd'); const lab = () => { b.textContent = SFX.enabled ? 'Sound on' : 'Sound off'; b.classList.toggle('on', SFX.enabled); b.setAttribute('aria-pressed', String(SFX.enabled)); };
  lab(); b.onclick = () => { SFX.setEnabled(!SFX.enabled); lab(); if (SFX.enabled) SFX.click(); };
  addEventListener('pointerdown', () => SFX.unlock(), { once: true }); }
$('#back').addEventListener('click', e => { if (history.length > 1) { e.preventDefault(); history.back(); } });
const gl = cv.getContext('webgl2', {antialias:false, alpha:false, premultipliedAlpha:false, powerPreference:'high-performance'});
if (!gl) {
  // no aura without WebGL2, but the page still works: a still background, the status sheet, sound
  hero.classList.add('nogl-on'); $('#nogl').style.display = 'grid'; $('#sheet').style.visibility = 'visible'; $('#ink').hidden = true;
  return;
}
const floatOK = !!gl.getExtension('EXT_color_buffer_float');

/* ---------------- shaders ---------------- */
const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.-1., 0., 1.); }`;

const COMMON = `#version 300 es
precision highp float;
out vec4 o;
float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
const mat2 MR = mat2(1.6,1.2,-1.2,1.6);
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=MR*p; a*=.5; } return v; }
float fbm3(vec2 p){ float v=0., a=.5; for(int i=0;i<3;i++){ v+=a*noise(p); p=MR*p; a*=.5; } return v; }
`;

const SCENE = COMMON + `
uniform vec2 R; uniform float T, P, BURST, SHOCK; uniform vec2 SHOCKPOS, M;
uniform vec4 RECT; uniform sampler2D PT, BG, DEP; uniform float HASBG, HASDEP; uniform vec2 BGSIZE;
uniform vec3 C_DEEP, C_AURA, C_HOT, C_ALT; uniform float INK;
uniform vec4 EYES; uniform float GLOW;   // both pupils in portrait uv (xy, zw); how lit the eyes and rim are

float A(vec2 u, float l){ return textureLod(PT, u, l).a; }

void main(){
  vec2 fc = gl_FragCoord.xy, uv = fc/R;
  float S = RECT.z;
  vec2 c  = RECT.xy + RECT.zw*vec2(.5,.47);
  vec2 q  = (fc - c)/S;
  float t = T, p = P;
  float fx = 0.;   // where the drawn effects are, so ink mode leaves the background alone
  float noInk = 0.; // the eye glow: ink mode would outline it in black, so it is kept out

  /* shockwave */
  vec2 sq = (fc - SHOCKPOS)/S; float sr = length(sq);
  float wave = (SHOCK > 0. && SHOCK < 1.) ? exp(-pow((sr - SHOCK*2.4)*7., 2.)) * (1.-SHOCK) : 0.;
  vec2 dist = normalize(sq + 1e-5) * wave * .05;
  vec2 qd = q - dist;
  vec2 uvp = (fc - RECT.xy)/RECT.zw - dist*S/RECT.zw;

  /* ---------- background ---------- */
  vec3 col;
  if (HASBG > .5) {
    /* 4K world reveal: dark + blurred while idle, your aura burns it open on hover */
    float ra = R.x/R.y, ia = BGSIZE.x/BGSIZE.y;
    float pc1 = min(p, 1.2);
    vec2 bu = uv - dist*S/R;
    vec2 sc = ra > ia ? vec2(1., ia/ra) : vec2(ra/ia, 1.);
    vec2 fcuv = c/R;
    bu = (bu - fcuv)*(1. - .035*pc1) + fcuv;                   // camera push-in toward you
    bu = (bu - .5)*sc*.975 + .5;
    // 2.5D parallax: near things (bright in the depth map) move more than far ones
    float dz = HASDEP > .5 ? textureLod(DEP, bu, 1.).r : .4;
    bu += ((M/R - .5) * -(.004 + .03*dz) + vec2(sin(t*.23), cos(t*.19)) * .0025 * dz) * sc;
    vec3 sharp = textureLod(BG, bu, 0.).rgb;
    vec3 blur  = textureLod(BG, bu, 4.5).rgb;
    float lb = dot(blur, vec3(.299,.587,.114));
    vec3 asleep = C_DEEP*.45 + vec3(lb)*.22;                   // dark, grey, blurry world
    float ls = dot(sharp, vec3(.299,.587,.114));
    vec3 awake = mix(sharp, sharp*sharp*1.5, .35) * .85;      // punchier contrast
    awake += C_AURA*pow(ls, 2.)*.35 + C_HOT*pow(ls, 5.)*.3;   // aura tints the highlights
    awake = mix(awake, awake*vec3(.85,.85,1.)*C_DEEP*6., .12);
    // burning reveal front, spreading out from you
    float rad = pc1*2.4 + BURST*1.2;
    float dR = length(qd*vec2(1., .8)) + (fbm(qd*3. + vec2(0., -t*.6)) - .5)*.5;
    float rv = 1. - smoothstep(rad - .3, rad, dR);
    col = mix(asleep, awake, rv);
    float front = smoothstep(.1, 0., abs(dR - rad + .05)) * step(.02, pc1) * step(dR, rad + .2);
    col += (C_AURA*1.1 + C_HOT*.25) * front * (1. - smoothstep(1.8, 2.6, rad)*.6);
    col *= mix(.5, 1., smoothstep(.05, .5, uv.x));             // keep the text side readable
  } else {
    float n  = fbm(qd*1.1 + vec2(t*.02, -t*.03));
    float n2 = fbm(qd*2.4 - vec2(0., t*.05) + n*1.5);
    col = C_DEEP*(.3 + 1.1*n2);
    col = mix(col, C_ALT*.22, smoothstep(.55,.85,n)*.7);
    // distant cel-shaded rock/ruin silhouettes on the horizon
    float hz = fbm3(vec2(uv.x*4. + 1.3, 2.))*.22 + .08;
    col = mix(col, C_DEEP*.12, smoothstep(hz+.004, hz, uv.y)*.9);
  }
  col *= .55 + .45*smoothstep(1.1, .0, abs(uv.y - .5)*2.);

  /* ---------- core glow, god rays, light pillar ---------- */
  float r = length(qd*vec2(1.,.8)), ang = atan(qd.y, qd.x);
  col += C_AURA*exp(-r*2.4)*(.06 + .55*min(p,1.));
  float rays = pow(noise(vec2(ang*9., t*.4)), 3.) * noise(vec2(ang*23., -t*.3)) * exp(-r*1.) * p * .8;
  col += mix(C_AURA, C_HOT, .4)*rays;
  col += C_AURA*exp(-abs(qd.x)*5.)*smoothstep(-.9, 1.4, qd.y)*.16*p;

  /* ---------- magic seal behind you ---------- */
  {
    float vis = smoothstep(.15, .7, p);
    vec2 sv = (qd - vec2(0., .1)) / (.62 + .1*min(p,1.) + .25*BURST);
    float sr2 = length(sv), sa = atan(sv.y, sv.x);
    float lw = .0045, seal = 0.;
    seal += smoothstep(lw*1.6, 0., abs(sr2 - .64));
    seal += smoothstep(lw, 0., abs(sr2 - .58));
    float tk = fract((sa + t*.12)/6.2831*96.);
    seal += step(tk, .3) * step(.585, sr2) * step(sr2, .635) * .6;
    float rs = (sa - t*.07)/6.2831*22., rid = floor(rs), rf = fract(rs);
    float cell = floor((sr2 - .44)/.022);
    float glyph = step(.12, rf)*step(rf, .88)*step(.45, hash(vec2(rid, cell)));
    seal += glyph * step(.44, sr2) * step(sr2, .53) * .55;
    seal += smoothstep(lw, 0., abs(sr2 - .43)) + smoothstep(lw, 0., abs(sr2 - .54));
    for (int k = 0; k < 2; k++) {
      float rot = t*.05*(k==0?1.:-1.) + float(k)*1.0472;
      float an = mod(sa + rot, 2.0944) - 1.0472;
      float dp = sr2*cos(an) - .205;
      seal += smoothstep(lw, 0., abs(dp)) * step(sr2, .42);
    }
    seal += smoothstep(lw, 0., abs(sr2 - .2));
    col += (C_AURA*.9 + C_HOT*.2) * seal * vis * (.6 + .4*sin(t*2.2));
    fx = max(fx, clamp(seal*vis, 0., 1.));
  }

  /* ---------- aura flames grown from your silhouette ---------- */
  vec2 lean = clamp((M - c)/S, -1., 1.) * .05 * p;
  vec2 fw = vec2(fbm(uvp*vec2(5., 2.4) + vec2(0., -t*1.6)), fbm(uvp*vec2(4., 2.) + vec2(7.3, -t*2.1)));
  float up = .12 + .28*min(p,1.) + .12*BURST;
  float F = A(uvp + vec2((fw.x - .5)*.10 - lean.x, -fw.y*up - lean.y*.5), 4.)
          + A(uvp + vec2((fw.y - .5)*.24 - lean.x*1.6, -fw.x*up*1.8), 5.5)*.9;
  float below = smoothstep(-.04, .12, uvp.y);                      // nothing grows below the portrait
  float body1 = A(uvp, 1.5);
  float Fc = clamp(clamp(F - body1*1.15, 0., 2.) * min(p, 1.) * 1.05, 0., 1.1) * below;   // hollow: strongest at your outline
  Fc = mix(Fc, floor(Fc*5.)/5., .45);                       // manhwa cel banding
  Fc = mix(Fc, floor(Fc*3. + .4)/3., INK);                  // ink mode: hard 3-step flames
  fx = max(fx, smoothstep(.05, .3, Fc));
  vec3 fcol = mix(C_ALT, C_AURA, smoothstep(.1, .5, Fc + fw.x*.2));
  fcol = mix(fcol, C_HOT, smoothstep(.8, 1.3, Fc));
  col += fcol * Fc * 1.25;

  /* ---------- cel-shaded ink smoke with glowing rims ---------- */
  float halo = (A(uvp, 6.5)*1.3 + A(uvp - vec2(0., .16), 7.)*1.1) * smoothstep(-.1, .15, uvp.y);
  {
    vec2 s2 = qd*1.8; float rise = t*.35;

  if (GLOW > .001) {
    float purple = smoothstep(.04, .2, pc.b - max(pc.r*.8, pc.g)) * a;         // the rim light already painted in the art
    col += (C_AURA*1.5 + C_HOT*.4) * purple * GLOW * 1.3;
    col += (C_AURA*1.4 + C_HOT*.8) * edge * smoothstep(.04, .2, uvp.y) * GLOW * 1.1;
    vec2 k = vec2(6./7., 1.);

  o = vec4(max(col, 0.), fx * (1. - noInk));
}`;

function compile(fs){
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);

  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));

}

function target(w, h){

function bindTex(prog, name, tex, unit){ gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(prog.u(name), unit); }

/* ---------------- main loop ---------------- */
let last = performance.now(), t0 = last, frames = 0, acc = 0, hudT = 0, bestAvg = 1, lastP = '', lastC = '';
resize(true);
function loop(now){
  const raw = (now - last)/1000, dt = Math.min(.05, raw); last = now;
  const t = (now - t0)/1000;

  // state
  if (charging) charge = Math.min(1, charge + dt/1.6);
  // eyes and rim: rise with the charge, flare at the release, then settle to a faint glow once you have awakened
  afterglow = Math.max(0, afterglow - dt/1.6);
  const idle = released ? .16 + .04*Math.sin(t*2.2) : 0;
  const want = charging ? .12 + .88*Math.pow(charge, 1.4) : Math.max(idle, afterglow);
  glow += (want - glow)*(1 - Math.exp(-dt*(want > glow ? 10 : 3)));
  if (charging && charge > .97 && !eyesLit) { eyesLit = true; SFX.maskLock(); }
  if (!charging) eyesLit = false;
  const tgt = charging ? .75 + charge*.65 : (hovering || awakened) ? .72 : .07;
  power += (tgt - power)*(1 - Math.exp(-dt*(tgt > power ? 3.2 : 1.6)));
  burst *= Math.exp(-dt*3.2);
  if (shock > 0) { shock += dt/1.1; if (shock >= 1) shock = 0; }
  const since = now - impactAt;
  const impact = (!reduce && impactAt > 0 && (since < 70 || (since > 120 && since < 165))) ? 1 : 0;   // inverted frames: skipped for reduced motion
  const vp = Math.min(power, 1).toFixed(2), vc = charge.toFixed(2);
  if (vp !== lastP) root.style.setProperty('--p', lastP = vp);
  if (vc !== lastC) root.style.setProperty('--charge', lastC = vc);
  if (charging || charge > 0) SwordCursor.charge(charging ? charge : 0);

  // adaptive resolution (Auto mode)
  // (the first second holds shader compiles and uploads, so it is not measured; frame times are not clamped here)
  if (t > 1) { frames++; acc += raw; }
  if (quality === 'auto' && frames >= 40) {
    const avg = acc/frames; frames = 0; acc = 0; bestAvg = Math.min(bestAvg, avg);
    if (avg > .024 && autoScale > .45) { autoScale = Math.max(.45, autoScale*.82); resize(true); }
    else if (avg < Math.min(.02, bestAvg*1.2) && autoScale < MAX_SCALE) { autoScale = Math.min(MAX_SCALE, autoScale*1.1); resize(true); }
  }
  if (now - hudT > 500) { hudT = now; if (DEV) $('#hud').textContent = `${W}×${H} · ${Math.round(1/Math.max(raw,.001))} fps`; $('#auraPct').textContent = Math.round(Math.max(0, Math.min(power,1.7))*100) + '%'; }

  const rect = rectUniform(), th = theme;
  pass(progScene, RT.scene, p => {
    gl.uniform2f(p.u('R'), W, H); gl.uniform1f(p.u('T'), t); gl.uniform1f(p.u('P'), power);
    gl.uniform1f(p.u('BURST'), burst); gl.uniform1f(p.u('SHOCK'), shock); gl.uniform2f(p.u('SHOCKPOS'), ...shockPos);
    gl.uniform2f(p.u('M'), ...mouse); gl.uniform4f(p.u('RECT'), ...rect);
    gl.uniform1f(p.u('HASBG'), hasBg); gl.uniform1f(p.u('HASDEP'), hasDep); bindTex(p, 'DEP', texDep, 2); gl.uniform4f(p.u('EYES'), ...EYES);
    gl.uniform1f(p.u('GLOW'), Math.min(glow, 1.2)); gl.uniform2f(p.u('BGSIZE'), ...bgSize);
    gl.uniform3f(p.u('C_DEEP'), ...th.deep); gl.uniform3f(p.u('C_AURA'), ...th.aura);
    gl.uniform3f(p.u('C_HOT'), ...th.glow); gl.uniform3f(p.u('C_ALT'), ...th.alt);
    bindTex(p, 'PT', texPortrait, 0); bindTex(p, 'BG', texBg, 1); gl.uniform1f(p.u('INK'), ink);
  });
  // bloom: 1/4 res + 1/16 res
  pass(progBright, RT.a, p => { gl.uniform2f(p.u('TEXEL'), 1/RT.a.w, 1/RT.a.h); gl.uniform1f(p.u('TH'), .9); bindTex(p, 'SRC', RT.scene.tex, 0); });
  pass(progBlur, RT.b, p => { gl.uniform2f(p.u('TEXEL'), 1/RT.b.w, 1/RT.b.h); gl.uniform2f(p.u('DIR'), 1, 0); bindTex(p, 'SRC', RT.a.tex, 0); });
  pass(progBlur, RT.a, p => { gl.uniform2f(p.u('TEXEL'), 1/RT.a.w, 1/RT.a.h); gl.uniform2f(p.u('DIR'), 0, 1); bindTex(p, 'SRC', RT.b.tex, 0); });
  pass(progBlur, RT.c, p => { gl.uniform2f(p.u('TEXEL'), 1/RT.c.w, 1/RT.c.h); gl.uniform2f(p.u('DIR'), 1, 0); bindTex(p, 'SRC', RT.a.tex, 0); });
  pass(progBlur, RT.d, p => { gl.uniform2f(p.u('TEXEL'), 1/RT.d.w, 1/RT.d.h); gl.uniform2f(p.u('DIR'), 0, 1); bindTex(p, 'SRC', RT.c.tex, 0); });
  pass(progComp, null, p => {
    gl.uniform2f(p.u('R'), W, H); gl.uniform1f(p.u('T'), t); gl.uniform1f(p.u('BURST'), burst); gl.uniform1f(p.u('IMPACT'), impact); gl.uniform1f(p.u('INK'), ink);
    gl.uniform3f(p.u('C_AURA'), ...th.aura);
    bindTex(p, 'SC', RT.scene.tex, 0); bindTex(p, 'BL', RT.a.tex, 1); bindTex(p, 'BL2', RT.d.tex, 2);
  });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

if (DEV) window.__aura = { set(p){ power = p; }, release(){ charge = 1; release(); }, hover(v){ hovering = v; } };
})();
</script>
